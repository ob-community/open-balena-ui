name: CI

on:
  # Do not build 3rd party package updates automatically to avoid some hacked package stealing secrets https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
  push:
    branches-ignore:
      - 'renovate/3rd-party**'
      - 'dependabot/**'
    paths-ignore:
      - ".github/dependabot.yml"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches-ignore:
      - 'renovate/3rd-party**'
      - 'dependabot/**'
    paths-ignore:
      - ".github/dependabot.yml"
      - ".github/workflows/codeql.yml"
      
env:
  IMAGE_NAME: obcommunity/open-balena-ui
  BASE_VERSION: '0.1.0' # Where action-vtl starts if there are no existing tags
  NODE_VERSION: 24 # Match the Dockerfile version

permissions:
  contents: read

jobs:
  # Sanity checks: Lint, test, and build the project
  build-test:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Establish Versioning, Tags, and Labels
        id: vtl
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
        uses: mapped/action-vtl@b5de908f4945891ebda221ce54bc6c8377ccce46
        with:
          baseVersion: ${{ env.BASE_VERSION }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Project dependencies
        run: npm ci

      - name: Linting
        if: false # ESLint needs added to dev-dependencies and configured properly...
        run: npm run lint

      - name: Testing
        run: npm run test

      - name: Build
        run: npm run build
        env:
          REACT_APP_OPEN_BALENA_UI_VERSION: ${{ steps.vtl.outputs.ver_semVerNoMeta }}

  balena-os-api-integration:
    name: BalenaOS real API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Project dependencies
        run: npm ci

      - name: Verify release assets and cache invalidation against ob-api
        run: npx tsx --test test/balenaOsSync.integration.test.ts
        env:
          BALENA_OS_INTEGRATION: '1'

  # Build the docker container in all branches (without pushing)
  build-docker:
    name: Build for docker
    runs-on: ubuntu-latest
    needs: [build-test, balena-os-api-integration]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true

      - name: Establish Versioning, Tags, and Labels
        id: vtl
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
        uses: mapped/action-vtl@b5de908f4945891ebda221ce54bc6c8377ccce46
        with:
          baseVersion: ${{ env.BASE_VERSION }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          dockerImage: ${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          provenance: false
          file: ./Dockerfile
          push: false
          build-args: |
            OPEN_BALENA_UI_VERSION=${{ steps.vtl.outputs.ver_semVerNoMeta }}
          tags: ${{ steps.vtl.outputs.docker_dtag || format('{0}:{1}', github.event.pull_request.head.repo.full_name, github.event.pull_request.number) }}
          labels: ${{ steps.vtl.outputs.oci_labels || 'org.opencontainers.image.title=open-balena-ui' }}

  # Build and push the docker container to Docker Hub for everything **except PRs**
  # main gets "latest" tag, all other branches get branch name tag and "prerelease" in the version
  # see: https://github.com/mapped/action-vtl?tab=readme-ov-file#docker-tags
  push-to-docker-hub:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: build-docker
    if: ${{ github.repository == 'ob-community/open-balena-ui' && !startsWith(github.ref, 'refs/pull/') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Establish Versioning, Tags, and Labels
        id: vtl
        uses: mapped/action-vtl@b5de908f4945891ebda221ce54bc6c8377ccce46
        with:
          baseVersion: ${{ env.BASE_VERSION }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          dockerImage: ${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          provenance: mode=max
          sbom: true
          file: ./Dockerfile
          push: ${{ steps.vtl.outputs.docker_push }}
          build-args: |
            OPEN_BALENA_UI_VERSION=${{ steps.vtl.outputs.ver_semVerNoMeta }}
          tags: ${{ steps.vtl.outputs.docker_tags }}
          labels: ${{ steps.vtl.outputs.oci_labels }}

      - name: Update package version
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          VERSION="${{ steps.vtl.outputs.ver_tag }}"
          npm version "${VERSION#v}" --no-git-tag-version

      - name: Commit updated package version
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f package.json package-lock.json

          if git diff --cached --quiet; then
            echo "Package version is already up to date"
          else
            git commit -m "chore: update package version [skip CI]"
            git push origin HEAD
          fi
